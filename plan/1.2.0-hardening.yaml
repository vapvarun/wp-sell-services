    - "wpss_register"
  cli_commands:
    - "wpss demo"
    - "wpss preflight"
    - "wpss service"
    - "wpss validate"

# Hardening cycle — NOTHING on the public surface may change. Empty by design.
# (Blocks wpss/buyer-requests, wpss/featured-services, wpss/seller-card,
#  wpss/service-categories, wpss/service-grid, wpss/service-search are equally
#  frozen; the verifier tracks them via the live block registry.)
migrations: []

# ── STANDARDS ────────────────────────────────────────────────────────────────
# REFERENCES only. Slaves invoke these skills/MCP for HOW.
standards:
  build_skills:  [wp-plugin-development, ux-foundation]
  audit_skills:  [wp-security-review, ux-audit, action-audit]
  phpstan_level: 6
  wpcs_standard: WordPress-Extra

# ── GATES ──────────────────────────────────────────────────────────────────
gates:
  default_static:     [php-lint, wpcs, phpstan]
  default_functional: [browser-smoke, qa-suite]

# ── JOURNEYS ─────────────────────────────────────────────────────────────────
# Hardening must not regress behaviour — these flows exercise the surfaces the
# changes touch, on the live site, after each wave.
journeys:
  - id: admin-moderation-actions
    role: admin
    steps:
      - "WP Admin -> WPSS -> Moderation; approve and reject a pending service"
      - "WP Admin -> WPSS Dashboard; perform the admin actions that hit Admin.php nonce-guarded handlers"
      - "each action succeeds for an admin and is rejected for a non-capable user"
      - "no JS console errors; correct at 390px and 1280px"
  - id: admin-metabox-save
    role: admin
    steps:
      - "edit a wpss_service: change packages/addons in the Service metabox, save"
      - "edit a wpss_request: change fields in the Buyer Request metabox, save"
      - "saved values persist and re-render correctly; no PHP notices in debug.log"
  - id: admin-settings-toast
    role: admin
    steps:
      - "WP Admin -> WPSS -> Settings -> Pages; trigger the page-create action"
      - "WP Admin -> WPSS -> Settings -> Demo content import/reset"
      - "feedback shows as the wpss admin-toast (no native alert/confirm dialog)"
      - "no JS console errors; correct at 390px and 1280px"
  - id: vendor-dashboard-ajax
    role: subscriber
    steps:
      - "open [wpss_dashboard] as a vendor; trigger the unified-dashboard actions"
      - "destructive actions confirm via the wpss modal (not native confirm)"
      - "AJAX handlers in AjaxHandlers.php respond correctly and never return 0"
  - id: pro-pair-still-loads
    role: admin
    steps:
      - "activate wp-sell-services-pro alongside the hardened free build"
      - "Pro dashboard sections, gateway cards, and settings tabs all render"
      - "no fatal/notice from a missing free hook, filter, service, or method"

# ── WAVES ────────────────────────────────────────────────────────────────────
waves:

  # Wave 1 — SECURITY (highest priority hardening). PHP-only, backend.
  # Two directions: real nonce-no-cap fixes vs. AjaxHandlers triage+doc.
  # Scopes are disjoint (Admin/* vs Frontend/AjaxHandlers.php).
  - id: wave-1-security
    depends_on: []
    functional_gates: [qa-suite, browser-smoke]
    journeys: [admin-moderation-actions, vendor-dashboard-ajax, pro-pair-still-loads]
    directions:
      - id: "1.1"
        title: "Add capability checks after nonce in real gaps (Admin.php, ServiceModerationPage.php)"
        journey: fix
        scope:
          - "src/Admin/Admin.php"
          - "src/Admin/Pages/ServiceModerationPage.php"
        skills: [wp-security-review, action-audit]
        static_gates: [php-lint, wpcs, phpstan]
        depends_on: []
      - id: "1.2"
        title: "Triage AjaxHandlers nonce-no-cap findings; add ownership guard where missing, document accepted object-ownership patterns"
        journey: fix
        scope:
          - "src/Frontend/AjaxHandlers.php"
        skills: [wp-security-review, action-audit]
        static_gates: [php-lint, wpcs, phpstan]
        depends_on: []

  # Wave 2 — INPUT-HANDLING hardening. PHP-only, backend.
  # Refactor 3 superglobal-iteration patterns to explicit-key reads.
  # Independent of wave 1 (different files), but ordered after so security
  # lands first and the contract-verifier runs on a clean base.
  - id: wave-2-input-handling
    depends_on: [wave-1-security]
    functional_gates: [qa-suite, browser-smoke]
    journeys: [admin-metabox-save, vendor-dashboard-ajax]
    directions:
      - id: "2.1"
        title: "Refactor metabox superglobal iteration to explicit-key reads (BuyerRequestMetabox, ServiceMetabox)"
        journey: improve
        scope:
          - "src/Admin/Metaboxes/BuyerRequestMetabox.php"
          - "src/Admin/Metaboxes/ServiceMetabox.php"
        skills: [wp-plugin-development, wp-security-review]
        static_gates: [php-lint, wpcs, phpstan]
        depends_on: []
      - id: "2.2"
        title: "Refactor AjaxHandlers superglobal iteration (line ~638) to explicit-key reads"
        journey: improve
        scope:
          - "src/Frontend/AjaxHandlers.php"
        skills: [wp-plugin-development, wp-security-review]
        static_gates: [php-lint, wpcs, phpstan]
        depends_on: []

  # Wave 3 — FRONTEND / JS UX hardening. JS + CSS only, no PHP, no contracts.
  # Disjoint by file: alert/confirm replacement vs. tap-target/breakpoint CSS.
  # Reuse existing admin-toast.js + components/wpss-ux-primitives.js — do NOT
  # introduce a new toast/modal library.
  - id: wave-3-frontend-ux
    depends_on: [wave-1-security, wave-2-input-handling]
    functional_gates: [browser-smoke, qa-suite]
    journeys: [admin-settings-toast, vendor-dashboard-ajax]
    directions:
      - id: "3.1"
        title: "Replace 5 alert()/confirm() with existing wpss admin-toast / UX-primitive modal"
        journey: improve
        scope:
          - "assets/js/admin-settings-demo.js"
          - "assets/js/admin-settings-pages.js"
          - "assets/js/unified-dashboard.js"
        skills: [ux-foundation, ux-audit]
        static_gates: [php-lint, wpcs, ux-audit, wiring]
        depends_on: []
      - id: "3.2"
        title: "Tap-target (>=40px) + breakpoint-proliferation cleanup in dashboard/wizard CSS"
        journey: improve
        scope:
          - "assets/css/dashboard.css"
          - "assets/css/wizard.css"
          - "assets/css/admin.css"
        skills: [ux-foundation, ux-audit]
        static_gates: [php-lint, wpcs, ux-audit]
        depends_on: []

  # Wave 4 — AUDIT verdict. Read-only producer; runs after all hardening green.
  - id: wave-4-audit
    depends_on: [wave-1-security, wave-2-input-handling, wave-3-frontend-ux]
    directions:
      - id: "4.1"
        title: "Product-readiness audit verdict for the 1.2.0 hardening cycle (is it shippable?)"
        journey: audit
        scope: ["**"]
        depends_on: []
