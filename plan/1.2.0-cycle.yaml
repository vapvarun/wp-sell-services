goal: >
  1.2.0 release cycle, customer-first, engineered for a 100k-site install
  base. FIRST build the model-site demo seeder and seed the local site.
  THEN fix the three live Basecamp bugs (homepage services query showing
  only user-scoped data; services archive + single UI breakage incl.
  borders, button backgrounds, category-label overlays, sidebar filters,
  transparent popups - reproduce on Reign 8.0.0 before fixing; surface the
  existing Favorites feature on archive + single). THEN run the systematic
  frontend usability uplift: this plugin predates the current
  wp-plugin-development and ux-foundation guidelines, so every frontend
  surface must be brought up to the design system via /ux-audit findings.
  THEN re-verify the already-merged security wave, finish the wppqa
  hardening backlog, add pretty dashboard permalinks with a 301 fallback,
  and prove 100k-site scale readiness with measured hot-path query budgets.
  All planning and execution follows wp-plugin-development and ux-audit
  guidelines and boundaries - no exceptions. Verify root cause before
  fixing - bug reports may be theme-interaction issues. Every UI change is
  browser-verified at 390px and 1280px on Reign 8.0.0. No public contract
  may change: every hook, REST route, AJAX action, shortcode, block, CLI
  command, option, DB table, and every free service/model signature the Pro
  plugin consumes stays byte-for-byte compatible (additive DB indexes
  allowed). Contract db_schema checks must query the live DB with SHOW
  TABLES via wp db query (NOT wp db tables, which lists only
  core-registered tables). Contract shortcode checks must verify against the
  live registry (wp eval 'global $shortcode_tags; ...') or grep add_shortcode
  in src/Frontend/Shortcodes.php - all 19 wpss_* shortcodes are registered
  unconditionally; a "removed" verdict for any of them is a verification
  error, re-check before reporting. Contract hook checks grep for
  do_action/apply_filters in THIS plugin's src/ and templates/ only.

