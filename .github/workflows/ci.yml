name: CI

on:
  push:
    # Release branches are named after the version they ship (e.g. `1.5.1`), so
    # CI must fire on them as well as on main. Without this, every release
    # branch was developed and tagged with no gate running at all.
    branches:
      - main
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Check PHP syntax
        run: find src/ -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" && exit 1 || echo "All files pass syntax check"


  phpcs:
    name: WPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run WPCS
        run: vendor/bin/phpcs --standard=phpcs.xml

  phpstan:
    # Level comes from phpstan.neon (currently 6). The job name previously said
    # "Level 5" and was wrong; keep the level out of the name so it cannot drift.
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      # 2G was not enough: the WordPress stubs alone exhaust it before analysis
      # of src/ completes, and the run dies with "reached configured PHP memory
      # limit" rather than reporting errors - which reads as a passing gate.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=6G --no-progress

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }} / WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            wp: '6.7'
          - php: '8.2'
            wp: '6.8'
          - php: '8.3'
            wp: 'latest'
          - php: '8.4'
            wp: 'latest'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Install subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Install WP test suite
        run: |
          bash bin/install-wp-tests.sh wp_tests root root 127.0.0.1 ${{ matrix.wp }} true
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

      # Previously `continue-on-error: true`, which meant a failing test suite
      # still reported a green build - the tests existed but gated nothing.
      - name: Run PHPUnit (unit tests)
        run: vendor/bin/phpunit --testsuite unit --no-coverage
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
