# Dashboard pretty permalinks (wave-6) change dashboard section URLs from
# ?section=X to /dashboard/X/. Old URLs MUST 301 to new — sanctioned here so
# the verifier does not flag the URL-shape change as a breach.
migrations:
  - kind: url_shape
    name: dashboard-section-permalinks
    reason: "Basecamp 9826303369 - dashboard sections move from ?section=<x> query strings to /dashboard/<x>/ rewrite endpoints for usability parity with WooCommerce/Dokan; old ?section=<x> URLs 301-redirect to the pretty form; no option, hook, or REST change"
  - kind: cli_commands
    name: wpss-scale-command
    reason: "Owner-directed 100k-site scale wave adds the ADDITIVE `wpss scale` WP-CLI command (seed/bench/teardown). No existing command changes or is removed."
  - kind: db_schema
    name: additive-hot-path-indexes
    reason: "Scale wave may ADD indexes to existing wpss_* tables for hot-path query budgets. Columns and tables themselves never change or get removed."
  - kind: hook
    name: wpss_dashboard_header
    reason: "Pre-existing Free/Pro drift surfaced by the wave-1 contract gate: Pro's WhiteLabel DashboardBrandingService has listened on wpss_dashboard_header since Pro 1.3.0 but Free NEVER fired it (dead listener; branded dashboard header never rendered). Free now fires do_action('wpss_dashboard_header') at the start of the unified dashboard header (UnifiedDashboard.php, additive, owner-committed). The hook stays in contracts: it is now a real fired hook."

standards:
  build_skills:  [wp-plugin-development, ux-foundation]
  audit_skills:  [wp-security-review, ux-audit, action-audit]
  phpstan_level: 6
  wpcs_standard: WordPress-Extra

gates:
  default_static:     [php-lint, wpcs, phpstan]
  default_functional: [browser-smoke, qa-suite]

journeys:
  # CUSTOMER journeys first — these mirror the Basecamp reports.
  - id: buyer-browse-services
    role: anonymous
    steps:
      - "open the site homepage (Services page set as front page): ALL published services from every vendor render, not just one user's"
      - "open /services/ archive: cards show borders, readable category labels with background overlay, buttons with background colors, working hover/selected states"
      - "sidebar filters render in the current design language and filter correctly"
      - "no JS console errors; correct at 390px and 1280px on Reign 8.0.0"
  - id: buyer-single-service
    role: subscriber
    steps:
      - "as buyer1, open a single service page: layout, colours, and buttons correct on Reign 8.0.0"
      - "open the message/inquiry popup: solid background, fully readable and usable (not transparent)"
      - "favorite the service from the single page; unfavorite; state persists on reload"
      - "no JS console errors; correct at 390px and 1280px"
  - id: buyer-favorites-archive
    role: subscriber
    steps:
      - "as buyer1, favorite a service from the /services/ archive card"
      - "favorite state reflects instantly and persists; favorites list shows the service in the dashboard"
      - "logged-out visitor sees a login prompt (not a silent failure) when tapping favorite"
  - id: admin-moderation-actions
    role: admin
    steps:
      - "WP Admin -> WPSS -> Moderation; approve and reject a pending service"
      - "WP Admin -> WPSS Dashboard; perform the admin actions that hit Admin.php nonce-guarded handlers"
      - "each action succeeds for an admin and is rejected for a non-capable user"
      - "no JS console errors; correct at 390px and 1280px"
  - id: admin-metabox-save
    role: admin
    steps:
      - "edit a wpss_service: change packages/addons in the Service metabox, save"
      - "edit a wpss_request: change fields in the Buyer Request metabox, save"
      - "saved values persist and re-render correctly; no PHP notices in debug.log"
  - id: admin-settings-toast
    role: admin
    steps:
      - "WP Admin -> WPSS -> Settings -> Pages; trigger the page-create action"
      - "WP Admin -> WPSS -> Settings -> Demo content import/reset"
      - "feedback shows as the wpss admin-toast (no native alert/confirm dialog)"
      - "no JS console errors; correct at 390px and 1280px"
  - id: vendor-dashboard-ajax
    role: subscriber
    steps:
      - "open [wpss_dashboard] as vendor1 (?autologin=vendor1); trigger the unified-dashboard actions"
      - "destructive actions confirm via the wpss modal (not native confirm)"
      - "AJAX handlers in AjaxHandlers.php respond correctly and never return 0"
  - id: dashboard-pretty-urls
    role: subscriber
    steps:
      - "as vendor1 open /dashboard/: section nav links use /dashboard/<section>/ pretty URLs"
      - "navigate to analytics, services, earnings sections via pretty URLs - each renders its section"
      - "legacy /dashboard/?section=services 301-redirects to /dashboard/services/"
      - "works on plain AND post-name permalink structures; no 404 after rules flush"
  - id: pro-pair-still-loads
    role: admin
    steps:
      - "activate wp-sell-services-pro alongside the hardened free build"
      - "Pro dashboard sections, gateway cards, and settings tabs all render"
      - "no fatal/notice from a missing free hook, filter, service, or method"

waves:

  # ══ Wave 0 — MODEL-SITE DEMO DATA (prerequisite for all UX verification) ══
  # `wp wpss demo create` currently seeds services only. Extend it so the
  # local site becomes a model marketplace: multiple vendors with profiles +
  # portfolios, buyers, orders across the 11-status lifecycle, reviews,
  # buyer requests + proposals, conversations/messages, favorites,
  # withdrawals. Then RUN it against the local site. The seeder ships in the
  # plugin (dev tooling, not a customer feature) and reads the REAL data
  # model - never invent a schema; reuse Models/Services classes.
  - id: wave-0-model-demo-data
    depends_on: []
    functional_gates: [qa-suite]
    journeys: [buyer-browse-services]
    directions:
      - id: "0.1"
        title: "Extend `wpss demo` CLI to seed a full model marketplace (5+ vendors w/ profiles+portfolios, 10+ buyers, 50+ orders across all 11 statuses, reviews, buyer requests + proposals, conversations, favorites, withdrawals) using existing Models/Services classes - then seed the local site with it"
        journey: develop
        scope:
          - "src/CLI/**"
          - "src/Demo/**"
        skills: [wp-plugin-development]
        static_gates: [php-lint, wpcs, phpstan]
        depends_on: []

  # ══ Wave 1 — CUSTOMER BUG: data correctness (Basecamp 9966680633) ══
  # Highest usability impact: buyers landing on the homepage cannot see the
  # marketplace. Root-cause first: the services archive query is being
  # user-scoped when the page is the static front page (likely a vendor-
  # dashboard query filter leaking into the main query, or the shortcode
  # falling back to current-author scope). Reproduce, trace, fix the query.
  - id: wave-1-homepage-data
    depends_on: [wave-0-model-demo-data]
    functional_gates: [browser-smoke, qa-suite]
    journeys: [buyer-browse-services]
    directions:
      - id: "1.1"
        title: "Fix services homepage/archive showing user-scoped data instead of all services (BC card 9966680633) - reproduce with Services page as front page, trace the query scoping, fix without touching the wpss_services shortcode signature"
        journey: fix
        scope:
          - "src/Frontend/**"
          - "src/Shortcodes/**"
          - "src/Blocks/**"
          - "templates/archive-*.php"
        skills: [wp-plugin-development]
        static_gates: [php-lint, wpcs, phpstan]
        depends_on: []

  # ══ Wave 2 — CUSTOMER BUGS: services UI + favorites (BC 9958056390, 9959210393) ══
  # What customers see broken today. Directions serialized inside the wave
  # because they share templates/ + frontend CSS. Every fix verified on
  # Reign 8.0.0 at 390px + 1280px. Verify root cause: some findings may be
  # Reign-theme interaction, not plugin CSS - if so, fix via plugin-side
  # theme-compat CSS, never by editing the theme.
  # Journeys: ONLY buyer-browse-services here. The favorites + popup steps in
  # buyer-single-service / buyer-favorites-archive verify work that lands in
  # wave-2b - gating them here tests the next wave's directions (learned the
  # hard way: first wave-2 gate run failed on the not-yet-built favorites UI).
  - id: wave-2-customer-ui
    depends_on: [wave-1-homepage-data]
    functional_gates: [browser-smoke, qa-suite]
    journeys: [buyer-browse-services]
    directions:
      - id: "2.1"
        title: "Services archive + single UI repair (BC 9958056390/9959210393): card borders, button background colors, category-label overlay readability, hover/selected states, sidebar filter restyle, colour/transparency fixes - reproduce on Reign 8.0.0 first"
        journey: fix
        scope:
          - "assets/css/frontend.css"
          - "assets/css/archive-service.css"
          - "assets/css/single-service.css"
          - "assets/css/design-system.css"
          - "templates/**"
        skills: [ux-foundation, ux-audit]
        static_gates: [php-lint, wpcs, ux-audit]
        depends_on: []
  # ══ Wave 2b — CUSTOMER BUGS part 2 (disjoint scopes, runs after 2.1 lands) ══
  - id: wave-2b-customer-ui
    depends_on: [wave-2-customer-ui]
    functional_gates: [browser-smoke, qa-suite]
    journeys: [buyer-single-service, buyer-favorites-archive]
    directions:
      - id: "2b.1"
        title: "Fix transparent message/inquiry popups (BC 9958056390 item 11): solid background, readable at both viewports, usable on Reign 8.0.0 - keep all popup styling in messaging.css"
        journey: fix
        scope:
          - "assets/css/messaging.css"
          - "assets/js/single-service.js"
        skills: [ux-foundation, ux-audit]
        static_gates: [php-lint, wpcs, ux-audit]
        depends_on: []
      - id: "2b.2"
        title: "Surface Favorites on archive cards + single service page (three-entry-point gap: REST /favorites + dashboard exist, frontend toggle missing) - reuse the existing favorites REST controller, no new endpoints; favorites JS lives in frontend.js"
        journey: improve
        scope:
          - "templates/**"
          - "assets/js/frontend.js"
          - "assets/css/frontend.css"
        skills: [wp-plugin-development, ux-foundation]
        static_gates: [php-lint, wpcs, ux-audit, wiring]
        depends_on: []

  # ══ Wave 2.5 — FRONTEND USABILITY UPLIFT (ux-foundation compliance) ══
  # OWNER DIRECTIVE: this plugin predates the current wp-plugin-development +
  # ux-foundation guidelines. Bring EVERY frontend surface up to the design
  # system: design tokens (no raw hex/px where a token exists), component
  # vocabulary (button/card/input/badge/empty-state), 3-breakpoint responsive
  # contract (640/1024/1440), 40px tap targets, visible focus rings, WCAG
  # 2.1 AA contrast, keyboard operability, hover/focus/visited states on
  # every <a> button. Run /ux-audit per surface FIRST to get the drift list,
  # then fix. Directions are split by surface; 2.5.1 owns the shared
  # design-system.css so it runs first, the rest serialize after it.
  # Every direction: browser-verified on Reign 8.0.0 at 390px + 1280px.
  - id: wave-2-5-ux-uplift
    depends_on: [wave-2-customer-ui, wave-2b-customer-ui]
    functional_gates: [browser-smoke, qa-suite]
    journeys: [buyer-browse-services, buyer-single-service, vendor-dashboard-ajax]
    directions:
      - id: "2.5.1"
        title: "ux-audit + token foundation: audit all frontend CSS against ux-foundation, consolidate design tokens in design-system.css, kill raw-hex/px drift, establish the 3-breakpoint contract shared by every surface"
        journey: improve
        scope:
          - "assets/css/design-system.css"
        skills: [ux-audit, ux-foundation]
        static_gates: [php-lint, wpcs, ux-audit]
        depends_on: []
      - id: "2.5.2"
        title: "Usability uplift - browse surfaces: services archive, single service, vendor profile/listing (cards, filters, badges, CTAs, empty states, focus rings, tap targets, a11y, hover/focus/visited on every <a> button)"
        journey: improve
        scope:
          - "assets/css/frontend.css"
          - "assets/css/archive-service.css"
          - "assets/css/single-service.css"
          - "templates/archive-service.php"
          - "templates/single-service.php"
          - "templates/content-service-card.php"
          - "templates/content-no-services.php"
          - "templates/vendor/**"
        skills: [ux-foundation, ux-audit]
        static_gates: [php-lint, wpcs, ux-audit]
        depends_on: ["2.5.1"]
      - id: "2.5.3"
        title: "Usability uplift - vendor/buyer dashboard + service wizard/edit: unified dashboard sections, wizard steps, forms, modals, toasts, empty states, mobile nav at 390px"
        journey: improve
        scope:
          - "assets/css/unified-dashboard.css"
          - "assets/css/vendor-dashboard.css"
          - "assets/css/service-wizard.css"
          - "assets/css/service-edit.css"
          - "templates/dashboard/**"
          - "templates/myaccount/**"
        skills: [ux-foundation, ux-audit]
        static_gates: [php-lint, wpcs, ux-audit]
        depends_on: ["2.5.1"]
      - id: "2.5.4"
        title: "Usability uplift - transaction + communication surfaces: cart, order details, disputes, buyer requests + proposals, messaging/conversations (forms, validation states, progress, receipts, empty states)"
        journey: improve
        scope:
          - "assets/css/orders.css"
          - "assets/css/buyer-request.css"
          - "assets/css/messaging.css"
          - "templates/cart/**"
          - "templates/order/**"
          - "templates/disputes/**"
          - "templates/partials/**"
          - "templates/archive-request.php"
          - "templates/single-request.php"
          - "templates/content-request-card.php"
          - "templates/content-no-requests.php"
        skills: [ux-foundation, ux-audit]
        static_gates: [php-lint, wpcs, ux-audit]
