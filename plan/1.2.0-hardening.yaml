# ─────────────────────────────────────────────────────────────────────────
# AutoVAP v2 — Migration Manifest
# Target: wp-sell-services (FREE)  ·  "1.2.0 audit + hardening cycle"
#
# Drafted by autovap-planner from audit/manifest.json + the
# audit/wppqa-baseline-2026-06-06 hardening backlog. Review + edit before run.
# Validate:  node ~/autovap-agent/scripts/validate-plan.mjs plan/1.2.0-hardening.yaml
#
# SCOPE: hardening only — code quality, security, escaping, consistency.
# NO new features. The public surface (contracts:) is FROZEN because the Pro
# sibling consumes 41 of these hooks + 15 free service/model classes directly.
# ─────────────────────────────────────────────────────────────────────────
version: 1

target:
  type: plugin
  slug: wp-sell-services
  path: /Users/varundubey/Local Sites/wpsellservices/app/public/wp-content/plugins/wp-sell-services
  repo: wbcomdesigns/wp-sell-services
  local_wp_site: wpsellservices
  site_url: https://wpsellservices.local
  pair: wp-sell-services-pro              # Pro is a hard consumer — coupling rules apply

goal: >
  Full audit + hardening for the 1.2.0 release cycle. Resolve the triaged
  wppqa hardening backlog without changing any public contract: replace the
  5 alert()/confirm() calls with the existing admin-toast/UX-primitive
  components, refactor the 3 $_POST/$_GET iteration patterns to explicit-key
  reads, close the real nonce-without-capability gaps in Admin.php and
  ServiceModerationPage.php, triage-and-document the AjaxHandlers
  object-ownership nonce findings, and clean up tap-target / breakpoint drift.
  No new features. Every public hook, REST route, AJAX action, shortcode,
  block, CLI command, option, and DB table — and every free service/model
  signature the Pro plugin consumes — must remain byte-for-byte compatible.

# ── CONTRACTS ──────────────────────────────────────────────────────────────
# FROZEN public surface. Seeded from audit/manifest.json and verified against
# what wp-sell-services-pro actually consumes (add_action/add_filter on 41
# wpss_* hooks + 15 WPSellServices\{Services,Models,API,Integrations} classes).
# The verifier diffs live state against this at every wave. Any change without a
# matching migrations: entry = HARD HALT. migrations is intentionally EMPTY —
# this is a hardening cycle; nothing on the public surface is allowed to move.
contracts:
  rest_routes:
    - namespace: "wpss/v1"
      # 138 endpoints across 24 controllers — the namespace + controller bases
      # are the contract. Route paths must not be renamed/removed.
      routes:
        - "/categories"
        - "/tags"
        - "/settings"
        - "/me"
        - "/dashboard"
        - "/search"
        - "/batch"
        - "/services"
        - "/orders"
        - "/reviews"
        - "/vendors"
        - "/conversations"
        - "/disputes"
        - "/buyer-requests"
        - "/proposals"
        - "/notifications"
        - "/portfolio"
        - "/earnings"
        - "/extensions"
        - "/milestones"
        - "/tips"
        - "/seller-levels"
        - "/moderation"
        - "/favorites"
        - "/media"
        - "/cart"
        - "/auth"
        - "/payment"
        - "/audit-log"
        - "/tour/complete"
  hooks:
    actions:
      # Pro entry + lifecycle actions Pro hooks into (verified in Pro source)
      - "wpss_loaded"
      - "wpss_pro_loaded"
      - "wpss_order_created"
      - "wpss_order_paid"
      - "wpss_order_status_changed"
      - "wpss_order_status_completed"
      - "wpss_order_status_cancelled"
      - "wpss_buyer_request_created"
      - "wpss_proposal_submitted"
      - "wpss_delivery_submitted"
      - "wpss_delivery_accepted"
      - "wpss_revision_requested"
      - "wpss_vendor_registered"
      - "wpss_withdrawal_processed"
      - "wpss_stripe_webhook_received"
    filters:
      # Extension filters Pro registers against (verified in Pro source)
      - "wpss_ecommerce_adapters"
      - "wpss_payment_gateways"
      - "wpss_storage_providers"
      - "wpss_wallet_providers"
      - "wpss_wallet_manager"
      - "wpss_analytics_widgets"
      - "wpss_dashboard_sections"
      - "wpss_dashboard_section_template"
      - "wpss_dashboard_section_before_content"
      - "wpss_dashboard_header"
      - "wpss_can_access_dashboard_section"
      - "wpss_api_controllers"
      - "wpss_settings_tabs"
      - "wpss_settings_tab_branding"
      - "wpss_settings_tab_stripe"
      - "wpss_settings_sections_payments"
      - "wpss_settings_sections_vendor"
      - "wpss_settings_sections_orders"
      - "wpss_gateway_cards"
      - "wpss_gateway_settings_razorpay"
      - "wpss_payment_callback_razorpay"
      - "wpss_admin_menu_label"
      - "wpss_commission_rate"
      - "wpss_email_from_name"
      - "wpss_email_header_vars"
      - "wpss_service_meta_fields"
      - "wpss_service_wizard_features"
      - "wpss_service_max_videos"
      - "wpss_service_max_gallery"
      - "wpss_service_max_faq"
      - "wpss_service_max_requirements"
      - "wpss_service_max_extras"
      - "wpss_service_limit_error_message"
      - "wpss_add_service_to_cart"
      - "wpss_tour_steps"
  options:
    # Stable, externally-observable option keys (settings groups + page refs +
    # versioning + gateway settings). Hardening must not rename these.
    - "wpss_version"
    - "wpss_general"
    - "wpss_vendor"
    - "wpss_orders"
    - "wpss_commission"
    - "wpss_payouts"
    - "wpss_tax"
    - "wpss_pages"
    - "wpss_advanced"
    - "wpss_notifications"
    - "wpss_review_moderation"
    - "wpss_stripe_settings"
    - "wpss_paypal_settings"
    - "wpss_offline_settings"
    - "wpss_wallet_provider"
    - "wpss_dashboard_page"
    - "wpss_vendors_page"
    - "wpss_order_confirmation_page"
    - "wpss_terms_page"
