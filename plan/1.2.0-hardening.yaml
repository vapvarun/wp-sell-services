  shortcodes:
    - "wpss_dashboard"
    - "wpss_account"
    - "wpss_services"
    - "wpss_service_search"
    - "wpss_featured_services"
    - "wpss_service_categories"
    - "wpss_service_wizard"
    - "wpss_vendors"
    - "wpss_vendor_profile"
    - "wpss_top_vendors"
    - "wpss_vendor_registration"
    - "wpss_buyer_requests"
    - "wpss_post_request"
    - "wpss_my_orders"
    - "wpss_order_details"
    - "wpss_cart"
    - "wpss_checkout"
