name: CI

on:
  push:
    # Release branches are named after the version they ship (e.g. `1.5.1`), so
    # CI must fire on them as well as on main. Without this, every release
    # branch was developed and tagged with no gate running at all.
    branches:
      - main
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Check PHP syntax
        run: find src/ -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" && exit 1 || echo "All files pass syntax check"


  phpcs:
    name: WPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      # The tree is at zero errors AND zero warnings. phpcs.xml no longer sets
      # ignore_warnings_on_exit, so phpcs itself exits non-zero on either and
      # this single step is the whole gate - no summary-parsing needed.
      #
      # The earlier "errors only" policy existed because the tree carried ~300
      # long-standing warnings and a gate that is red from day one gets ignored.
      # Those were worked through: WP-idiom families are excluded in phpcs.xml
      # with reasoning, individually-justified ones carry a site-local
      # phpcs:ignore, and the real ones were fixed. A warning now is a NEW one.
      - name: Run WPCS (fails on errors and warnings)
        run: vendor/bin/phpcs --standard=phpcs.xml --report=full

  phpstan:
    # Level comes from phpstan.neon (currently 6). The job name previously said
    # "Level 5" and was wrong; keep the level out of the name so it cannot drift.
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      # 2G was not enough: the WordPress stubs alone exhaust it before analysis
      # of src/ completes, and the run dies with "reached configured PHP memory
      # limit" rather than reporting errors - which reads as a passing gate.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=6G --no-progress

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }} / WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            wp: '6.7'
          - php: '8.2'
            wp: '6.8'
          - php: '8.3'
            wp: 'latest'
          - php: '8.4'
            wp: 'latest'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Install subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Install WP test suite
        run: |
          bash bin/install-wp-tests.sh wp_tests root root 127.0.0.1 ${{ matrix.wp }} true
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

      # Previously `continue-on-error: true`, which meant a failing test suite
      # still reported a green build - the tests existed but gated nothing.
      - name: Run PHPUnit (unit tests)
        run: vendor/bin/phpunit --testsuite unit --no-coverage
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

  # The three python gates below already existed in bin/ and already exit
  # non-zero on failure, but nothing ran them automatically - they fired only
  # when a developer remembered. i18n-verify is the one that catches version
  # drift between the plugin header, the POT Project-Id-Version, package.json
  # and the readme Stable tag, which is exactly the class of mistake that
  # breaks a release, so "runs if someone remembers" was not a gate at all.
  project-gates:
    name: i18n / docs / app parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Fails on version drift across the four version sources, and on a POT
      # that is stale relative to the source strings.
      - name: i18n + version drift
        run: python3 bin/i18n-verify.py

      # Fails when docs reference a Settings tab or admin menu path that the
      # plugin does not actually render.
      - name: Docs audit
        run: python3 bin/docs-audit.py

      # Fails when a feature has no reachable REST route - this plugin is
      # mobile-app ready by contract, so an unreachable feature is a defect.
      - name: App parity
        run: python3 bin/app-parity.py

  # audit/manifest.json is the canonical inventory that every task is supposed
  # to read BEFORE adding a hook, route or helper. It is only useful while it is
  # true, and today nothing noticed when it went stale.
  #
  # Deliberately a diff-based reminder, NOT a regeneration: CLAUDE.md marks this
  # plugin manifest_refresh: agent-enumeration-only because REST registers
  # through a controller-array wrapper, so the deterministic generator
  # undercounts REST (142 -> 7) and would silently clobber the file. Never wire
  # the generator in here.
  manifest-freshness:
    name: Manifest freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manifest updated alongside contract changes
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)

          # Surfaces that define the plugin's public contract.
          CONTRACT=$(echo "$CHANGED" | grep -E '^src/(API/.*Controller\.php|Database/SchemaManager\.php|CLI/.*\.php)$' || true)

          if [ -n "$CONTRACT" ] && ! echo "$CHANGED" | grep -q '^audit/manifest\.json$'; then
            echo "::error::Contract files changed without updating audit/manifest.json:"
            echo "$CONTRACT"
            echo ""
            echo "Update the affected manifest section in the same commit."
            echo "Do NOT run the deterministic generator - it undercounts REST for this plugin."
            exit 1
          fi
          echo "Manifest freshness OK"
