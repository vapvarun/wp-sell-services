version: 1

target:
  type: plugin
  slug: wp-sell-services
  path: /Users/varundubey/Local Sites/wpsellservices/app/public/wp-content/plugins/wp-sell-services
  repo: wbcomdesigns/wp-sell-services
  local_wp_site: wpsellservices
  site_url: https://wpsellservices.local
